[package]
name = "krokiet"
version = "12.0.2"
authors = ["Rafał Mikrut <mikrutrafal@protonmail.com>"]
edition = "2024"
rust-version = "1.94.1"
description = "Slint frontend of Czkawka Core"
license = "GPL-3.0-only"
repository = "https://github.com/qarmin/czkawka"
build = "build.rs"

[dependencies]
czkawka_core = { version = "12.0.2", path = "../czkawka_core" }
chrono = "0.4.45"
open = "5.4"
crossbeam-channel = "0.5"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
home = "0.5"
log = "0.4.34"
serde = "1.0"
serde_json = "1.0"
humansize = "2.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1.12"
fs_extra = "1.3" # TODO replace with less buggy library
num_enum = "0.7.6"
regex = "1.13"
arboard = "3"

# Translations
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = { version = "8.13", features = ["debug-embed"] }

# Try to use only needed features from https://github.com/slint-ui/slint/blob/master/api/rs/slint/Cargo.toml#L23-L31
#slint = { path = "../test/slint/api/rs/slint", default-features = false, features = [
#slint = { git = "https://github.com/slint-ui/slint.git", rev = "fdde7a535305d2ab2d4072dee637bad186a49723", default-features = false, features = [
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "compat-1-2",
] }
i-slint-backend-winit = "=1.17.0"

rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-all"], optional = true }
notify-rust = { version = "4" }

# Easier cross-compilation of app to e.g. 32 bit os, by using dlopen instead of linking libraries at compile time
# Must match version used in slint
fontique = { version = "=0.11.1", default-features = false, features = ["fontconfig-dlopen", "std"] }

[build-dependencies]
#slint-build = { path = "../test/slint/api/rs/build" }
#slint-build = { git = "https://github.com/slint-ui/slint.git", rev = "fdde7a535305d2ab2d4072dee637bad186a49723" }
slint-build = "1.18.1"

[features]
default = ["winit_femtovg", "winit_software"]

# Audio support
audio = ["rodio"]

# Renderers
skia_opengl = ["slint/renderer-skia-opengl"]
skia_vulkan = ["slint/renderer-skia-vulkan"]
software = ["slint/renderer-software"]
femtovg = ["slint/renderer-femtovg"]
femtovg_wgpu = ["slint/renderer-femtovg-wgpu"]
winit_femtovg = ["slint/renderer-winit-femtovg"]
winit_skia_opengl = ["slint/renderer-winit-skia-opengl"]
winit_skia_vulkan = ["slint/renderer-winit-skia-vulkan"]
winit_software = ["slint/renderer-winit-software"]

# Additional features
heif = ["czkawka_core/heif"]
libraw = ["czkawka_core/libraw"]
libavif = ["czkawka_core/libavif"]

# Allows to use trash on Linux when using xdg-portal, needed by e.g. flatpak where normal trash access always fails
# No-op on other OSes, it is slower and provides less helpful error messages
xdg_portal_trash = ["czkawka_core/xdg_portal_trash"]

[lints]
workspace = true
