[package]
name = "czkawka_bk_tree"
version = "0.5.0"
authors = ["Eugene Bulkin <eugene.bulkin2@gmail.com>"]
edition = "2024"
rust-version = "1.94.1"
description = "BK-tree implementation vendored from bk-tree 0.5.0"
license = "MIT"
repository = "https://github.com/eugene-bulkin/rust-bk-tree"

[dependencies]
fnv = "1.0"

[dev-dependencies]
bk-tree = { version = "0.5", default-features = false }
criterion = { version = "0.8", default-features = false, features = [] }
hamming-bitwise-fast = "1.0"
rand = "0.10.3"

[[bench]]
name = "bktree_benchmark"
harness = false

[lints]
workspace = true
