name: 🐧 Linux

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CZKAWKA_OFFICIAL_BUILD: ${{ vars.CZKAWKA_OFFICIAL_BUILD }}

jobs:
  linux-all:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner_arch: X64, target: x86_64-unknown-linux-gnu.2.17 }
          - { arch: arm64, runner_arch: ARM64, target: aarch64-unknown-linux-gnu.2.17 }
    env:
      ARCHNAME: ${{ matrix.arch }}
      TARGET_DIR: target/${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6

      - name: Install basic libraries
        run: sudo apt update || true; sudo apt install p7zip-full -y

      - name: Setup rust version
        run: |
          rustup default 1.94.1
          rustup target add ${TARGET_DIR#target/}

      # Zig links against an old glibc, so the binaries run on older distros
      - name: Install zig and cargo-zigbuild
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar -xJ -C ~/.cargo
          ln -sf ~/.cargo/zig-x86_64-linux-0.16.0/zig ~/.cargo/bin/zig
          curl -fsSL https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.24.0/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz \
            | tar -xJ -C ~/.cargo/bin --strip-components=1 --wildcards '*/cargo-zigbuild'

      - name: Build Release
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          sed -i 's/#lto = /lto = /g' Cargo.toml
          sed -i 's/#codegen-units /codegen-units /g' Cargo.toml
          
          echo "VERS=release" >> $GITHUB_ENV
          
          cargo zigbuild --target ${{ matrix.target }} --bin czkawka_cli --bin krokiet --release
          mv $TARGET_DIR/release/czkawka_cli linux_czkawka_cli_${{ env.ARCHNAME }}
          mv $TARGET_DIR/release/krokiet linux_krokiet_femtovg_opengl_${{ env.ARCHNAME }}
          cargo zigbuild --target ${{ matrix.target }} --release --bin krokiet --no-default-features --features "vello"
          mv $TARGET_DIR/release/krokiet linux_krokiet_vello_${{ env.ARCHNAME }}
          cargo zigbuild --target ${{ matrix.target }} --release --bin krokiet --no-default-features --features "femtovg_wgpu"
          mv $TARGET_DIR/release/krokiet linux_krokiet_femtovg_wgpu_${{ env.ARCHNAME }}
          cargo zigbuild --target ${{ matrix.target }} --release --bin krokiet --no-default-features --features "winit_femtovg,winit_software,femtovg_wgpu,vello"
          mv $TARGET_DIR/release/krokiet linux_krokiet_all_backends_${{ env.ARCHNAME }}

      # Fast CI profile, to avoid out of disk space errors
      # I doubt that anyone would use debug builds from here, because they are slow and contains not final changes
      - name: Build Debug
        if: ${{ github.ref != 'refs/heads/master' }}
        run: |
          sed -i 's/^\(\[profile\.dev\.package.*\)/#\1/' Cargo.toml
          sed -i 's|^opt-level = 3 # OPT PACKAGES|#opt-level = 3 # OPT PACKAGES|' Cargo.toml
          
          echo "VERS=debug" >> $GITHUB_ENV
          
          cargo zigbuild --target ${{ matrix.target }} --bin czkawka_cli --bin krokiet --profile fastci
          mv $TARGET_DIR/fastci/czkawka_cli linux_czkawka_cli_${{ env.ARCHNAME }}
          mv $TARGET_DIR/fastci/krokiet linux_krokiet_femtovg_opengl_${{ env.ARCHNAME }}
          cargo zigbuild --target ${{ matrix.target }} --bin krokiet --no-default-features --features "vello" --profile fastci
          mv $TARGET_DIR/fastci/krokiet linux_krokiet_vello_${{ env.ARCHNAME }}
          cargo zigbuild --target ${{ matrix.target }} --bin krokiet --no-default-features --features "femtovg_wgpu" --profile fastci
          mv $TARGET_DIR/fastci/krokiet linux_krokiet_femtovg_wgpu_${{ env.ARCHNAME }}
          cargo zigbuild --target ${{ matrix.target }} --bin krokiet --no-default-features --features "winit_femtovg,winit_software,femtovg_wgpu,vello" --profile fastci
          mv $TARGET_DIR/fastci/krokiet linux_krokiet_all_backends_${{ env.ARCHNAME }}

      - name: Set default Krokiet backend
        run: cp linux_krokiet_femtovg_opengl_${{ env.ARCHNAME }} linux_krokiet_${{ env.ARCHNAME }}

      - name: Package krokiet with launchers
        run: bash misc/pack_all_backends.sh linux_krokiet_all_backends_${{ env.ARCHNAME }} linux_krokiet_all_backends_${{ env.ARCHNAME }}.zip

      - name: Pack with 7z
        run: |
          # 7z -mx=3 in rust files, takes 40% less space but is 2x slower than zip -mx=1
          # 7z -mx=3 is 8x faster than 7z -mx=5, but generates 20% bigger 
          # So looks that -mx=3 is the best option
          time 7z a -t7z -mx=3 czkawka_all.7z \
            linux_czkawka_cli_${{ env.ARCHNAME }} \
            linux_krokiet_${{ env.ARCHNAME }} \
            linux_krokiet_femtovg_opengl_${{ env.ARCHNAME }} \
            linux_krokiet_vello_${{ env.ARCHNAME }} \
            linux_krokiet_femtovg_wgpu_${{ env.ARCHNAME }} \
            linux_krokiet_all_backends_${{ env.ARCHNAME }}.zip

      - name: Store
        uses: actions/upload-artifact@v6
        with:
          name: all-${{ runner.os }}-${{ matrix.runner_arch }}-${{ env.VERS }}
          path: |
            czkawka_all.7z

      - name: Release
        if: ${{ github.ref == 'refs/heads/master' && vars.HAVE_PAT_REPOSITORY_TOKEN == '1' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "Nightly"
          files: |
            linux_czkawka_cli_${{ env.ARCHNAME }}
            linux_krokiet_${{ env.ARCHNAME }}
            linux_krokiet_femtovg_opengl_${{ env.ARCHNAME }}
            linux_krokiet_vello_${{ env.ARCHNAME }}
            linux_krokiet_femtovg_wgpu_${{ env.ARCHNAME }}
            linux_krokiet_all_backends_${{ env.ARCHNAME }}.zip
          token: ${{ secrets.PAT_REPOSITORY }}

  ### MUSL CLI and Krokiet Release and Debug
  # GUI not works with MUSL :(
  # https://github.com/slint-ui/slint/issues/7586
  # https://github.com/rust-windowing/winit/issues/1818
  linux-cli-musl:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-26.04, target: x86_64-unknown-linux-musl }
          - { arch: arm64, runner: ubuntu-26.04-arm, target: aarch64-unknown-linux-musl }
    env:
      OUTPUT_NAME: linux_czkawka_cli_musl_${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6

      - name: Install basic libraries
        run: |
          sudo apt update || true; sudo apt install musl-tools -y

      - name: Setup rust version
        run: |
          rustup default 1.94.1
          rustup target add ${{ matrix.target }}

      - name: Build Release
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          sed -i 's/#lto = /lto = /g' Cargo.toml
          sed -i 's/#codegen-units /codegen-units /g' Cargo.toml
          cargo build --release --bin czkawka_cli --target ${{ matrix.target }}

          mv target/${{ matrix.target }}/release/czkawka_cli ${{ env.OUTPUT_NAME }}

      - name: Build Debug
        if: ${{ github.ref != 'refs/heads/master' }}
        run: |
          sed -i 's/^\(\[profile\.dev\.package.*\)/#\1/' Cargo.toml
          sed -i 's|^opt-level = 3 # OPT PACKAGES|#opt-level = 3 # OPT PACKAGES|' Cargo.toml
          cargo build --bin czkawka_cli --target ${{ matrix.target }}

          mv target/${{ matrix.target }}/debug/czkawka_cli ${{ env.OUTPUT_NAME }}

      - name: Store Linux CLI
        uses: actions/upload-artifact@v6
        with:
          name: czkawka_cli-${{ runner.os }}-musl-${{ matrix.arch }}
          path: |
            ${{ env.OUTPUT_NAME }}

      - name: Release
        uses: softprops/action-gh-release@v3
        if: ${{ github.ref == 'refs/heads/master' && vars.HAVE_PAT_REPOSITORY_TOKEN == '1' }}
        with:
          tag_name: "Nightly"
          files: |
            ${{ env.OUTPUT_NAME }}
          token: ${{ secrets.PAT_REPOSITORY }}

  ### Below, builds that do not produce artifacts

  ### 32 bit CLI and Krokiet Release and Debug
  linux-all-debug-32bit:
    if: ${{ github.ref != 'refs/heads/master' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - name: Install basic libraries
        run: |
          sudo apt update || true
          sudo apt install gcc-multilib -y

      - name: Setup rust version and target
        run: |
          rustup default 1.94.1
          rustup target add i686-unknown-linux-gnu

      - name: Build Debug for 32-bit
        run: |
          sed -i 's/^\(\[profile\.dev\.package.*\)/#\1/' Cargo.toml
          sed -i 's|^opt-level = 3 # OPT PACKAGES|#opt-level = 3 # OPT PACKAGES|' Cargo.toml
          cargo build --target i686-unknown-linux-gnu --bin czkawka_cli --bin krokiet
          mv target/i686-unknown-linux-gnu/debug/czkawka_cli linux_czkawka_cli_32bit
          mv target/i686-unknown-linux-gnu/debug/krokiet linux_krokiet_32bit

      - name: Store
        uses: actions/upload-artifact@v6
        with:
          name: all-32bit-${{ runner.os }}-${{ runner.arch }}-debug
          path: |
            linux_czkawka_cli_32bit
            linux_krokiet_32bit

  linux-stability:
    if: ${{ github.ref == 'refs/heads/master' }} # Runs only in master, because it is really time consuming
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # nightly disabled until notify-rust includes https://github.com/hoodie/notify-rust/pull/297
        toolchain: [1.94.1] # , nightly]
    steps:
      - uses: actions/checkout@v6

      - name: Install basic libraries
        run: sudo apt update || true

      - name: Setup rust version
        run: rustup default ${{ matrix.toolchain }}

      - name: Build packages
        run: |
          rm -rf target || true
          cargo build --bin czkawka_cli --bin krokiet
          mv target/debug/czkawka_cli czkawka_cli_debug_1
          mv target/debug/krokiet krokiet_debug_1
          
          rm -rf target || true
          cargo build --bin czkawka_cli --bin krokiet --release
          mv target/release/czkawka_cli czkawka_cli_release_1
          mv target/release/krokiet krokiet_release_1
          
          rm -rf target || true
          cargo build --bin czkawka_cli --bin krokiet
          mv target/debug/czkawka_cli czkawka_cli_debug_2
          mv target/debug/krokiet krokiet_debug_2
          
          rm -rf target || true
          cargo build --bin czkawka_cli --bin krokiet --release
          mv target/release/czkawka_cli czkawka_cli_release_2
          mv target/release/krokiet krokiet_release_2
          
          bash misc/compare_files.sh

  linux-tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - name: Install basic libraries
        run: sudo apt update || true; sudo apt install libasound2-dev xvfb imagemagick libgl1-mesa-dri mesa-vulkan-drivers libxkbcommon-x11-0 -y

      - name: Setup rust version
        run: rustup default 1.94.1

      - name: Test
        run: |
          sed -i 's/^\(\[profile\.dev\.package.*\)/#\1/' Cargo.toml
          sed -i 's|^opt-level = 3 # OPT PACKAGES|#opt-level = 3 # OPT PACKAGES|' Cargo.toml
          xvfb-run cargo test --all-features --workspace --exclude czkawka_gui

      # Reuses the dependencies compiled by the tests above
      - name: Build Krokiet
        run: cargo build --all-features --bin krokiet

      - name: E2E tests
        run: cd e2e && cargo run --release -- ../target/debug/krokiet

      - name: Upload screenshots of failed checks
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-screenshots-${{ github.sha }}
          path: e2e/artifacts
          if-no-files-found: ignore

  linux-regression-tests-on-minimal-rust-version:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - name: Install basic libraries
        run: sudo apt update || true; sudo apt install ffmpeg -y

      - name: Setup rust version
        run: rustup default 1.94.1

      - name: Build test version
        run: |
          sed -i 's/^\(\[profile\.dev\.package.*\)/#\1/' Cargo.toml
          sed -i 's|^opt-level = 3 # OPT PACKAGES|#opt-level = 3 # OPT PACKAGES|' Cargo.toml
          cargo build --profile test --bin czkawka_cli

      - name: Linux Regression Test
        run: |
          wget -q https://github.com/qarmin/czkawka/releases/download/6.0.0/TestFiles.zip
          cd ci_tester
          cargo build --release
          cd ..

          ci_tester/target/release/ci_tester target/debug/czkawka_cli

  android:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup rust version and target
        run: |
          rustup default 1.94.1
          rustup target add aarch64-linux-android

      - name: Check for Android
        run: |
          cd czkawka_core
          cargo check --target aarch64-linux-android --features "blake_pure"
